<p class="section-title mb-1">Explorador BQ — Detalle de Item (__AREA__)</p>
<p class="text-xs text-gray-500 mb-4">Dataset completo del query Ecatman Item Total. Filtra por cualquier campo descriptivo y ordena cualquier columna numérica de mayor a menor haciendo click en el encabezado.</p>

<div id="explorerFilters" class="flex flex-wrap gap-2 items-end mb-3"></div>

<div class="flex justify-between items-center mb-2 text-xs text-gray-500">
  <span id="explorerCount">-</span>
  <div class="flex items-center gap-2">
    <label>Filas por página:
      <select id="explorerPageSize" class="filter-select">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="250">250</option>
      </select>
    </label>
    <button id="explorerReset" class="pill-input bg-gray-100 hover:bg-gray-200">Limpiar filtros</button>
  </div>
</div>

<div class="overflow-x-auto" style="max-height: 560px; overflow-y: auto;">
  <table class="text-sm w-full border-collapse">
    <thead id="explorerHead"></thead>
    <tbody id="explorerBody"></tbody>
    <tfoot id="explorerFoot" style="position: sticky; bottom: 0;"></tfoot>
  </table>
</div>

<div class="flex justify-center items-center gap-3 mt-3 text-sm">
  <button id="explorerPrev" class="pill-input bg-gray-100 hover:bg-gray-200">‹ Anterior</button>
  <span id="explorerPageInfo" class="text-xs text-gray-500">-</span>
  <button id="explorerNext" class="pill-input bg-gray-100 hover:bg-gray-200">Siguiente ›</button>
</div>
